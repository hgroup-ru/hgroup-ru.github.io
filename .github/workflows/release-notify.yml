name: Release Telegram Notification

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    steps:
      - name: Collect release metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          changelog_file="$(mktemp)"
          notes_file="$(mktemp)"
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          suffix="-${RUN_NUMBER}"
          release_record="$(printf '%s' "$releases" | jq -c --arg suffix "$suffix" '[.[] | select(.tag_name | endswith($suffix))][0] // {}')"
          release_url="$(printf '%s' "$release_record" | jq -r '.html_url // ""')"

          gh api "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md?ref=${SOURCE_SHA}" \
            --jq .content | base64 --decode > "$changelog_file"
          awk '
            /^## Следующий релиз[[:space:]]*$/ { capture = 1; next }
            capture && /^## / { exit }
            capture && /^<!-- release-title: .* -->$/ { next }
            capture && /^_Изменений для следующего релиза пока нет\._$/ { next }
            capture { print }
          ' "$changelog_file" > "$notes_file"

          echo "url=$release_url" >> "$GITHUB_OUTPUT"
          delimiter="RELEASE_NOTES_$(date +%s%N)"
          echo "notes<<$delimiter" >> "$GITHUB_OUTPUT"
          cat "$notes_file" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          RELEASE_RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RELEASE_URL: ${{ steps.metadata.outputs.url }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram notifications are not configured; skipping."
            exit 0
          fi

          message_file="$(mktemp)"
          python3 > "$message_file" <<'PY'
          import html
          import os

          result = os.environ.get("RELEASE_RESULT", "")
          run_number = os.environ.get("RUN_NUMBER", "?")
          release_url = os.environ.get("RELEASE_URL", "").strip()
          run_url = os.environ.get("RUN_URL", "").strip()
          notes = os.environ.get("RELEASE_NOTES", "").strip()

          if result == "success":
              lines = ["#release #production #success", "🟢 <b>Официальный релиз опубликован</b>"]
              if release_url:
                  lines.append(f'<a href="{html.escape(release_url, quote=True)}">GitHub Release</a>')
          elif result == "cancelled":
              lines = [
                  "#release #production #cancelled",
                  f"⚪ <b>Официальный релиз #{run_number} отменён</b>",
              ]
          else:
              lines = [
                  "#release #production #failed",
                  f"🔴 <b>Официальный релиз #{run_number} завершился с ошибкой</b>",
                  "Проверь Actions перед повторным запуском.",
              ]

          if run_url and result != "success":
              lines.append(f'<a href="{html.escape(run_url, quote=True)}">Actions</a>')

          if notes and result == "success":
              if len(notes) > 1800:
                  notes = notes[:1800].rstrip() + "\n…"
              lines.extend(["", "<b>Что нового</b>", f"<blockquote expandable>{html.escape(notes)}</blockquote>"])

          print("\n".join(lines))
          PY

          curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text@${message_file}" \
            >/dev/null
