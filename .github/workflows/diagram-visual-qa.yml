name: Diagram Visual QA

on:
  pull_request:
    branches:
      - main
    paths:
      - i18n/ru/docusaurus-plugin-content-docs/current/extras/ejections.mdx
      - i18n/ru/docusaurus-plugin-content-docs/current/extras/ejections/**
      - i18n/ru/docusaurus-plugin-content-docs/current/variant-specific/no-positive-clues.mdx
      - i18n/ru/docusaurus-plugin-content-docs/current/variant-specific/no-positive-clues/**
      - i18n/ru/docusaurus-plugin-content-docs/current/variant-specific/odds-and-evens.mdx
      - i18n/ru/docusaurus-plugin-content-docs/current/variant-specific/odds-and-evens/**
      - i18n/ru/docusaurus-plugin-content-docs/current/variant-specific/up-or-down.mdx
      - i18n/ru/docusaurus-plugin-content-docs/current/variant-specific/up-or-down/**
      - .github/workflows/diagram-visual-qa.yml

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/workflows/setup

      - name: Build RU site
        run: npm run build:ru

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture exact teaching diagrams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          python3 -m http.server 3000 --directory build >/tmp/diagram-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/variant-specific/up-or-down.html >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/diagram-http.log
              exit 1
            fi
            sleep 1
          done

          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const targets = [
              ['transparent-double-bluff', 'variant-specific/no-positive-clues', 'the-transparent-double-bluff'],
              ['five-odd-ejection', 'variant-specific/odds-and-evens', 'the-5-odd-ejection'],
              ['u-turn-finesse', 'variant-specific/up-or-down', 'the-u-turn-finesse'],
              ['trash-push-ejection', 'extras/ejections', 'trash-push-ejection'],
            ];

            const profiles = [
              ['desktop', { width: 1280, height: 900 }],
              ['mobile', { width: 390, height: 844 }],
            ];

            const browser = await chromium.launch({ headless: true });
            try {
              for (const [profile, viewport] of profiles) {
                const context = await browser.newContext({ viewport });
                const page = await context.newPage();
                for (const [slug, path, anchor] of targets) {
                  await page.goto(`http://127.0.0.1:3000/${path}.html#${anchor}`, {
                    waitUntil: 'networkidle',
                  });
                  const heading = page.locator(`#${anchor}`);
                  await heading.waitFor({ state: 'visible' });
                  const diagram = heading.locator(
                    'xpath=following::svg[contains(concat(" ", normalize-space(@class), " "), " example ")][1]',
                  );
                  await diagram.waitFor({ state: 'visible' });
                  await diagram.scrollIntoViewIfNeeded();
                  await diagram.screenshot({ path: `screenshots/${slug}-${profile}.png` });
                }
                await context.close();
              }
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: diagram-visual-qa
          path: screenshots/*.png
