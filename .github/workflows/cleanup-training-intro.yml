name: Cleanup Training Intro

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-training-intro.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'fix/human-review-diagram-notes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Remove internal crawler wording
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("i18n/ru/docusaurus-plugin-content-docs/current")
          changed = []
          for path in sorted(root.glob("level-*.mdx")):
              lines = path.read_text().splitlines(keepends=True)
              out = []
              touched = False
              for line in lines:
                  if "RU crawler" not in line:
                      out.append(line)
                      continue
                  prefix = re.split(r"(?:[.;]\s+)?[Оо]тветы\b", line, maxsplit=1)[0].rstrip(" ;.\n")
                  out.append((prefix + ".\n") if prefix else "")
                  touched = True
              if touched:
                  path.write_text("".join(out))
                  changed.append(path)

          expected = {
              root / "level-1.mdx",
              root / "level-3.mdx",
              root / "level-4.mdx",
              root / "level-5.mdx",
              root / "level-25.mdx",
          }
          if set(changed) != expected:
              raise SystemExit(f"Unexpected RU crawler files: {[str(p) for p in changed]}")
          PY

          if grep -RIn --include='level-*.mdx' 'RU crawler' i18n/ru/docusaurus-plugin-content-docs/current; then
            echo 'RU crawler wording still present' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add i18n/ru/docusaurus-plugin-content-docs/current/level-{1,3,4,5,25}.mdx
          git diff --cached --check
          git commit -m 'docs: remove internal crawler wording from training questions'
          git push origin HEAD:${{ github.head_ref }}
