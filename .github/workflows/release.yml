name: Release

on:
  workflow_dispatch: {}

concurrency:
  group: official-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Official Release must run from main."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate fresh release notes
        shell: bash
        run: |
          notes_file="$(mktemp)"
          previous_notes_file="$(mktemp)"

          extract_notes() {
            awk '
              /^## Следующий релиз[[:space:]]*$/ { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' "$1"
          }

          normalize_notes() {
            awk '
              /^<!-- release-title: .* -->$/ { next }
              /^_Изменений для следующего релиза пока нет\._$/ { next }
              {
                sub(/[[:space:]]+$/, "")
                if ($0 != "") print
              }
            '
          }

          extract_notes CHANGELOG.md > "$notes_file"
          if ! normalize_notes < "$notes_file" | grep -q .; then
            echo "CHANGELOG.md has no release notes in 'Следующий релиз'."
            exit 1
          fi
          if ! grep -Eq '^<!-- release-title: .+ -->$' "$notes_file"; then
            echo "CHANGELOG.md is missing '<!-- release-title: ... -->' metadata."
            exit 1
          fi

          previous_tag="$(git tag --list 'prod-*' --sort=-creatordate | grep -E '^prod-[0-9]{8}-[0-9]+$' | head -n 1)"
          if [ -n "$previous_tag" ] && git cat-file -e "$previous_tag:CHANGELOG.md" 2>/dev/null; then
            git show "$previous_tag:CHANGELOG.md" | awk '
              /^## Следующий релиз[[:space:]]*$/ { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' > "$previous_notes_file"
            if diff -q <(normalize_notes < "$notes_file") <(normalize_notes < "$previous_notes_file") >/dev/null; then
              echo "Release notes are unchanged from $previous_tag."
              exit 1
            fi
          fi

  publish:
    needs: prepare
    uses: ./.github/workflows/publish.yml
    with:
      notify_failure: false
    permissions:
      contents: read
      pages: write
      id-token: write

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      production_tag: ${{ steps.production_tag.outputs.tag }}
      github_release: ${{ steps.github_release.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Tag official release source
        id: production_tag
        shell: bash
        run: |
          tag="prod-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$tag")"
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag $tag already exists on $tagged_sha, expected $GITHUB_SHA."
              exit 1
            fi
          else
            git tag -a "$tag" "$GITHUB_SHA" -m "Official release from $GITHUB_SHA"
            git push origin "$tag"
          fi
          echo "PRODUCTION_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: github_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$(mktemp)"
          awk '
            /^## Следующий релиз[[:space:]]*$/ { capture = 1; next }
            capture && /^## / { exit }
            capture && /^<!-- release-title: .* -->$/ { next }
            capture && /^_Изменений для следующего релиза пока нет\._$/ { next }
            capture { print }
          ' CHANGELOG.md > "$notes_file"
          title="H-Group RU — $PRODUCTION_TAG"
          if gh release view "$PRODUCTION_TAG" >/dev/null 2>&1; then
            gh release edit "$PRODUCTION_TAG" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$PRODUCTION_TAG" --verify-tag --title "$title" --notes-file "$notes_file"
          fi
          echo "name=$title" >> "$GITHUB_OUTPUT"

  archive-release-notes:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Validate archive configuration
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.STATE_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.STATE_SYNC_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_CLIENT_ID" && test -n "$APP_PRIVATE_KEY"

      - name: Create short-lived archive token
        id: archive_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STATE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.STATE_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.archive_token.outputs.token }}
          fetch-depth: 0

      - name: Archive released changelog section
        id: archive_change
        shell: bash
        env:
          GH_TOKEN: ${{ steps.archive_token.outputs.token }}
          RELEASED_SOURCE_SHA: ${{ github.sha }}
          PRODUCTION_TAG: ${{ needs.release.outputs.production_tag }}
          GITHUB_RELEASE: ${{ needs.release.outputs.github_release }}
        run: |
          released_changelog="$(mktemp)"
          git show "$RELEASED_SOURCE_SHA:CHANGELOG.md" > "$released_changelog"
          published_at="$(gh release view "$PRODUCTION_TAG" --json publishedAt --jq .publishedAt)"
          release_date="$(TZ=Europe/Moscow date -d "$published_at" +%F)"
          python3 scripts/archive_release_notes.py \
            --current CHANGELOG.md \
            --released "$released_changelog" \
            --release-date "$release_date" \
            --released-source "$RELEASED_SOURCE_SHA" \
            --production-tag "$PRODUCTION_TAG" \
            --github-release "$GITHUB_RELEASE"
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/archive-${PRODUCTION_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: archive $PRODUCTION_TAG release notes"
          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create archival PR
        id: archive_pr
        if: steps.archive_change.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.archive_token.outputs.token }}
          BRANCH: ${{ steps.archive_change.outputs.branch }}
          PRODUCTION_TAG: ${{ needs.release.outputs.production_tag }}
        run: |
          pr_url="$(gh pr create --base main --head "$BRANCH" --title "docs: archive $PRODUCTION_TAG release notes" --body "Mechanical post-release archival of the released \`Следующий релиз\` section in \`CHANGELOG.md\`.")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Wait for archival PR checks
        if: steps.archive_change.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.archive_pr.outputs.url }}
        run: |
          sleep 5
          gh pr checks "$PR_URL" --watch --fail-fast --interval 10

      - name: Merge archival PR
        if: steps.archive_change.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.archive_token.outputs.token }}
          PR_URL: ${{ steps.archive_pr.outputs.url }}
          HEAD_SHA: ${{ steps.archive_change.outputs.head_sha }}
        run: gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$HEAD_SHA"

  sync-maintainer-state:
    needs:
      - release
      - archive-release-notes
    if: ${{ always() && needs.release.result == 'success' && needs.archive-release-notes.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: github-pages
    steps:
      - name: Validate state sync configuration
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.STATE_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.STATE_SYNC_APP_PRIVATE_KEY }}
          TARGET_REPOSITORY: ${{ vars.STATE_SYNC_REPOSITORY }}
          TARGET_ENTRYPOINT: ${{ vars.STATE_SYNC_ENTRYPOINT }}
        run: |
          test -n "$APP_CLIENT_ID" && test -n "$APP_PRIVATE_KEY" && test -n "$TARGET_REPOSITORY" && test -n "$TARGET_ENTRYPOINT"

      - name: Create short-lived state sync token
        id: state_sync_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STATE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.STATE_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.STATE_SYNC_REPOSITORY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve current public main
        id: public_main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out state sync target
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ vars.STATE_SYNC_REPOSITORY }}
          ref: main
          token: ${{ steps.state_sync_token.outputs.token }}
          path: maintainer-state-sync
          fetch-depth: 0

      - name: Apply private-owned state transformation
        shell: bash
        working-directory: maintainer-state-sync
        env:
          STATE_SYNC_RELEASED_SOURCE_SHA: ${{ github.sha }}
          STATE_SYNC_PRODUCTION_TAG: ${{ needs.release.outputs.production_tag }}
          STATE_SYNC_GITHUB_RELEASE: ${{ needs.release.outputs.github_release }}
          STATE_SYNC_PUBLIC_MAIN_SHA: ${{ steps.public_main.outputs.sha }}
          TARGET_ENTRYPOINT: ${{ vars.STATE_SYNC_ENTRYPOINT }}
        run: python3 "$TARGET_ENTRYPOINT"

      - name: Prepare state sync branch
        id: state_change
        shell: bash
        working-directory: maintainer-state-sync
        env:
          PRODUCTION_TAG: ${{ needs.release.outputs.production_tag }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/release-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "state: sync $PRODUCTION_TAG"
          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create state sync PR
        id: state_pr
        if: steps.state_change.outputs.changed == 'true'
        shell: bash
        working-directory: maintainer-state-sync
        env:
          GH_TOKEN: ${{ steps.state_sync_token.outputs.token }}
          BRANCH: ${{ steps.state_change.outputs.branch }}
          PRODUCTION_TAG: ${{ needs.release.outputs.production_tag }}
        run: |
          pr_url="$(gh pr create --base main --head "$BRANCH" --title "state: sync $PRODUCTION_TAG" --body "Mechanical sync of objective official-release facts from hgroup-ru.github.io.")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Merge state sync PR
        if: steps.state_change.outputs.changed == 'true'
        shell: bash
        working-directory: maintainer-state-sync
        env:
          GH_TOKEN: ${{ steps.state_sync_token.outputs.token }}
          PR_URL: ${{ steps.state_pr.outputs.url }}
          HEAD_SHA: ${{ steps.state_change.outputs.head_sha }}
        run: gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$HEAD_SHA"

  notify:
    name: Telegram completion notification
    needs:
      - prepare
      - publish
      - release
      - archive-release-notes
      - sync-maintainer-state
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          ARCHIVE_RESULT: ${{ needs.archive-release-notes.result }}
          STATE_RESULT: ${{ needs.sync-maintainer-state.result }}
          PRODUCTION_TAG: ${{ needs.release.outputs.production_tag }}
          GITHUB_RELEASE: ${{ needs.release.outputs.github_release }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram notifications are not configured; skipping."
            exit 0
          fi

          release_url=""
          if [ -n "$PRODUCTION_TAG" ]; then
            release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${PRODUCTION_TAG}"
          fi

          if [ "$RELEASE_RESULT" = "success" ] \
            && [ "$ARCHIVE_RESULT" = "success" ] \
            && [ "$STATE_RESULT" = "success" ]; then
            status='#success'
            headline='🟢 Официальный релиз опубликован'
          elif [ "$RELEASE_RESULT" = "success" ]; then
            status='#warning'
            headline='🟡 Релиз опубликован, но post-release завершился неуспешно'
          elif [ "$PREPARE_RESULT" = "cancelled" ] \
            || [ "$PUBLISH_RESULT" = "cancelled" ] \
            || [ "$RELEASE_RESULT" = "cancelled" ]; then
            status='#cancelled'
            headline='⚪ Официальный релиз отменён до публикации'
          else
            status='#failed'
            headline='🔴 Официальный релиз упал до публикации'
          fi

          lines="#release #production ${status}\n${headline}\nSource: ${SOURCE_SHA}"
          if [ -n "$PRODUCTION_TAG" ]; then
            lines="${lines}\nTag: ${PRODUCTION_TAG}"
          fi
          if [ -n "$GITHUB_RELEASE" ]; then
            lines="${lines}\n${GITHUB_RELEASE}"
          fi
          if [ -n "$release_url" ]; then
            lines="${lines}\n${release_url}"
          fi
          if [ "$status" != '#success' ]; then
            lines="${lines}\nprepare=${PREPARE_RESULT} publish=${PUBLISH_RESULT} release=${RELEASE_RESULT} archive=${ARCHIVE_RESULT} state=${STATE_RESULT}\n${RUN_URL}"
          fi

          printf '%b' "$lines" | curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@-" \
            >/dev/null
