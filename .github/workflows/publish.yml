name: Publish Site

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - i18n/**
      - src/**
      - static/**
      - plugins/**
      - docusaurus.config.ts
      - sidebars.ts
      - babel.config.cjs
      - tsconfig.json
      - package.json
      - package-lock.json
      - scripts/build.mts
      - scripts/compilePlugin.mts
      - scripts/generateProductData.mts
      - scripts/tsconfig.json
      - .github/workflows/setup/**
  workflow_dispatch:
    inputs:
      notify_failure:
        description: Notify Telegram if publishing fails
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      notify_failure:
        description: Notify Telegram if publishing fails
        required: false
        type: boolean
        default: true

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/workflows/setup

      - name: Build RU site
        run: npm run build:ru

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record deployment
        run: |
          echo "### Published source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "### Site: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Telegram failure notification
    needs:
      - build
      - deploy
    if: ${{ always() && (github.event_name == 'push' || inputs.notify_failure == true) && (needs.build.result != 'success' || needs.deploy.result != 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram notifications are not configured; skipping."
            exit 0
          fi

          text="$(printf '#publish #production #failed\n🔴 Публикация сайта завершилась неуспешно\nBuild: %s · Deploy: %s\nSource: %s\n%s' \
            "$BUILD_RESULT" "$DEPLOY_RESULT" "$SOURCE_SHA" "$RUN_URL")"

          curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            >/dev/null
