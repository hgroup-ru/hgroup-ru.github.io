name: Publish Site

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - i18n/**
      - src/**
      - static/**
      - plugins/**
      - docusaurus.config.ts
      - sidebars.ts
      - babel.config.cjs
      - tsconfig.json
      - package.json
      - package-lock.json
      - scripts/build.mts
      - scripts/compilePlugin.mts
      - scripts/generateProductData.mts
      - scripts/tsconfig.json
      - .github/workflows/setup/**
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/workflows/setup

      - name: Build RU site
        run: npm run build:ru

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record deployment
        run: |
          echo "### Published source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "### Site: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
