name: Format Training Questions Audit

on:
  push:
    branches:
      - content/training-questions-audit
    paths:
      - .github/workflows/prettier-training-audit.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/training-questions-audit
          fetch-depth: 0
      - uses: ./.github/workflows/setup
      - name: Run Prettier on changed content
        run: npx prettier --write BACKLOG.md CHANGELOG.md i18n/ru/docusaurus-plugin-content-docs/current/level-1.mdx i18n/ru/docusaurus-plugin-content-docs/current/level-2.mdx i18n/ru/docusaurus-plugin-content-docs/current/level-25.mdx i18n/ru/docusaurus-plugin-content-docs/current/level-7.mdx
      - name: Remove one-shot formatter and commit
        run: |
          rm .github/workflows/prettier-training-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format Training Questions audit"
          git push origin HEAD:content/training-questions-audit
