name: Algolia Diagnostic

on:
  issues:
    types:
      - closed

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event.issue.number == 102
    runs-on: ubuntu-latest

    steps:
      - name: Query Algolia Crawler
        env:
          GH_TOKEN: ${{ github.token }}
          ALGOLIA_CRAWLER_USER_ID: ${{ secrets.ALGOLIA_CRAWLER_USER_ID }}
          ALGOLIA_CRAWLER_API_KEY: ${{ secrets.ALGOLIA_CRAWLER_API_KEY }}
          ALGOLIA_CRAWLER_ID: ${{ secrets.ALGOLIA_CRAWLER_ID }}
        shell: bash
        run: |
          if [ -z "$ALGOLIA_CRAWLER_USER_ID" ] ||
             [ -z "$ALGOLIA_CRAWLER_API_KEY" ] ||
             [ -z "$ALGOLIA_CRAWLER_ID" ]; then
            gh issue comment 102 --body 'Algolia diagnostic: required crawler secrets are not configured.'
            exit 1
          fi

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --user "$ALGOLIA_CRAWLER_USER_ID:$ALGOLIA_CRAWLER_API_KEY" "https://crawler.algolia.com/api/1/crawlers/$ALGOLIA_CRAWLER_ID/reindex")"

          message="$(jq -r '.message // .error // .detail // empty' "$response_file" 2>/dev/null || true)"
          if [ -z "$message" ]; then
            message='Algolia returned no structured error message.'
          fi

          gh issue comment 102 --body "Algolia diagnostic: HTTP ${http_code}: ${message}"

          if [[ "$http_code" != 2* ]]; then
            cat "$response_file"
            exit 1
          fi
