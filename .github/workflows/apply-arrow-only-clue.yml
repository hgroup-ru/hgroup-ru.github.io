name: Apply Arrow-only Clue Support

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-arrow-only-clue.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/u-turn-finesse-colored-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('plugins/hanabiDocusaurusPlugin/plugin/src/convertYAMLToSVG.ts')
          text = path.read_text()

          old_condition = '    const { clue } = card;\n    if (clue !== undefined) {\n'
          new_condition = '    const { clue } = card;\n    if (clue !== undefined || card.clueArrow === true) {\n'
          if text.count(old_condition) != 1:
              raise SystemExit('Unexpected clue condition count')
          text = text.replace(old_condition, new_condition, 1)

          marker = '      // Draw the clue circle on the arrow.\n'
          if text.count(marker) != 1:
              raise SystemExit('Unexpected clue-circle marker count')
          text = text.replace(marker, '      if (clue !== undefined) {\n        // Draw the clue circle on the arrow.\n', 1)

          close_marker = '      if (this.yOffset === 0) {\n        this.yTop = Math.min(this.yTop, -35);\n      }\n'
          if text.count(close_marker) != 1:
              raise SystemExit('Unexpected clue yTop block count')
          text = text.replace(close_marker, '      }\n\n' + close_marker, 1)

          path.write_text(text)
          PY

          npx prettier --write plugins/hanabiDocusaurusPlugin/plugin/src/convertYAMLToSVG.ts plugins/hanabiDocusaurusPlugin/plugin/src/hanabiGameState.ts
          git diff --check

      - name: Commit renderer patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/hanabiDocusaurusPlugin/plugin/src/convertYAMLToSVG.ts plugins/hanabiDocusaurusPlugin/plugin/src/hanabiGameState.ts
          git commit -m 'feat: render arrow-only variant clues'
          git push origin HEAD:${{ github.head_ref }}
