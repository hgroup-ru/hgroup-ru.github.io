name: Apply Training Questions Audit

on:
  push:
    branches:
      - content/training-questions-audit
    paths:
      - .github/workflows/apply-training-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/training-questions-audit
          fetch-depth: 0
      - name: Apply audited Training Questions edits
        run: python scripts/apply_training_audit.py
      - name: Commit audited batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "content: audit Training Questions"
          git push origin HEAD:content/training-questions-audit
