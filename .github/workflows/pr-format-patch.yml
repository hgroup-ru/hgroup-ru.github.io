name: PR Format Patch

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: pr-format-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/workflows/setup

      - name: Generate formatting patch
        id: format
        shell: bash
        run: |
          npm run format

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --binary > format.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload formatting patch
        if: steps.format.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: error
          retention-days: 7

      - name: Explain required formatting
        if: steps.format.outputs.changed == 'true'
        shell: bash
        run: |
          echo "Formatting changes are required."
          echo "Download the format-patch artifact from this workflow run and apply it with: git apply format.patch"
          echo "Same-repository PRs can alternatively ask a maintainer to run /format."
          exit 1
