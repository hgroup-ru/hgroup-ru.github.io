name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  candidate-diagram-qa:
    if: ${{ github.event_name == 'push' && github.ref_name == 'feat/extras-teaching-diagrams-20260827' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/extras-teaching-diagrams-20260827
          fetch-depth: 0
      - uses: ./.github/workflows/setup
      - name: Apply final candidate edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          special = Path('i18n/ru/docusaurus-plugin-content-docs/current/extras/special-bluffs.mdx')
          text = special.read_text()
          wrong = 'У Боба никак не может быть красная 3 на _Finesse Position_'
          right = 'У Боба никак не может быть красной 3 на _Finesse Position_'
          assert text.count(wrong) == 3, text.count(wrong)
          special.write_text(text.replace(wrong, right))

          bcme = Path('i18n/ru/docusaurus-plugin-content-docs/current/extras/ejections/bad-chop-move-ejection.yml')
          text = bcme.read_text()
          text = text.replace('below: Already played', 'below: Trash duplicate')
          text = text.replace(
              'уже является сыгранным мусором. Поэтому Боб',
              'является копией уже сыгранной карты и потому мусором. Поэтому Боб',
          )
          bcme.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          placeholder = '_Изменений для следующего релиза пока нет._'
          notes = '''<!-- release-title: Directness Principle и новые учебные диаграммы -->

После прошлого официального релиза русская версия получила два свежих уточнения H-Group и четыре новые локальные teaching diagrams для сложных prose-only конвенций.

### Добавлено

- В Extras добавлены четыре локальные учебные диаграммы H-Group RU для примеров без official upstream YML: Bad Chop Move Ejection, Pass Bluff, Trash Pull и Continuation Clue. Каждая схема явно помечена как локальная и служит визуальным объяснением уже существующего текста, а не новым правилом.

### Улучшено

- На 10-м уровне добавлен новый Directness Principle: если две линии приводят к одинаковому результату, включая одинаковые superpositions на всех картах с подсказками, предпочтительна менее сложная линия.
- В Special-Fives уточнены Color Promise и исключение Color Play Clue Lie: лишние карты неправильного цвета должны затрагиваться в той же руке и в рамках той же подсказки.
'''
          assert placeholder in text
          changelog.write_text(text.replace(placeholder, notes, 1))

          backlog = Path('BACKLOG.md')
          text = backlog.read_text()
          pattern = r'\n## Локальные учебные диаграммы\n.*?(?=\n## Сопровождение upstream\n)'
          text, count = re.subn(pattern, '\n', text, flags=re.S)
          assert count == 1, count
          backlog.write_text(text)
          PY
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Build RU
        run: npm run build:ru
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Serve built site
        run: |
          python3 -m http.server 4173 --directory build > /tmp/hgroup-serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hgroup-serve.log
          exit 1
      - name: Browser visual QA
        run: |
          mkdir -p visual-qa
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage({viewport: {width: 1600, height: 1100}, deviceScaleFactor: 1});
          const cases = [
            ['ejections-bcme', '/extras/ejections#the-bad-chop-move-ejection-bcme', 'Bad Chop Move Ejection'],
            ['special-bluffs-pass', '/extras/special-bluffs#the-pass-bluff', 'Pass Bluff'],
            ['pushes-pulls-trash-pull', '/extras/pushes-pulls#interaction-between-the-trash-pull-and-trash-double-ignition', 'Interaction Between the Trash Pull'],
            ['play-clues-continuation', '/extras/play-clues#the-continuation-clue-touching-both-inside-and-outside-a-layer', 'Continuation Clue'],
          ];
          const errors = [];
          page.on('pageerror', error => errors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
          for (const theme of ['light', 'dark']) {
            for (const [name, path, headingText] of cases) {
              await page.goto(`http://127.0.0.1:4173${path}`, {waitUntil: 'networkidle'});
              await page.evaluate(t => {
                localStorage.setItem('theme', t);
                document.documentElement.setAttribute('data-theme', t);
              }, theme);
              const heading = page.locator('h3').filter({hasText: headingText}).first();
              await heading.waitFor({state: 'visible'});
              await heading.scrollIntoViewIfNeeded();
              await page.evaluate(() => window.scrollBy(0, -90));
              await page.waitForTimeout(400);
              const diagram = page.locator('.game-state, .hanabi-game-state, [class*=gameState], [class*=GameState]').first();
              if (await diagram.count() === 0) console.log(`${name}: diagram rendered without known class hook; screenshot inspection will verify it`);
              await page.screenshot({path: `visual-qa/${name}-${theme}.png`, fullPage: false});
            }
          }
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: extras-teaching-diagrams-visual-qa
          path: visual-qa/*.png
          if-no-files-found: error
      - name: Restore canonical CI and push finalized candidate
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md BACKLOG.md .github/workflows/ci.yml i18n/ru/docusaurus-plugin-content-docs/current/extras
          git commit -m 'chore: finalize teaching diagrams'
          git push origin HEAD:feat/extras-teaching-diagrams-20260827

  validate:
    name: ${{ github.event_name == 'pull_request' && 'validate' || 'validate-push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Validate release notes
        run: python3 scripts/validate_release_notes.py

      - name: Validate production workflow invariants
        run: python3 scripts/validate_production_workflows.py

      - name: Validate notification workflow invariants
        run: python3 scripts/validate_notification_workflows.py

      - name: Detect site build requirement
        id: site-build
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            required="$(git diff --name-only HEAD^1 HEAD^2 | python3 scripts/site_build_required.py)"
          else
            required="true"
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "Site build required: $required"

      - name: Setup
        id: setup
        uses: ./.github/workflows/setup

      - name: Lint
        run: npm run lint

      - name: Build RU site
        if: ${{ always() && steps.setup.outcome == 'success' && steps.site-build.outputs.required == 'true' && !startsWith(github.head_ref, 'automation/') }}
        run: npm run build:ru

  notify:
    name: Telegram notification
    needs: validate
    if: ${{ always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'automation/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          CI_RESULT: ${{ needs.validate.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram notifications are not configured; skipping."
            exit 0
          fi

          notification_is_current() {
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            current_state="$(printf '%s' "$pr_json" | jq -r .state)"
            current_head="$(printf '%s' "$pr_json" | jq -r .head.sha)"

            if [ "$current_state" != "open" ]; then
              echo "PR #$PR_NUMBER is $current_state; skipping CI notification."
              return 1
            fi

            if [ "$current_head" != "$RUN_HEAD_SHA" ]; then
              echo "CI run is stale: run head $RUN_HEAD_SHA, current PR head $current_head; skipping notification."
              return 1
            fi
          }

          if ! notification_is_current; then
            exit 0
          fi

          case "$CI_RESULT" in
            success)
              text="$(printf '#pr #ci #ready\n🟢 PR #%s готов к merge\n%s\nCI: validate ✓\n%s' \
                "$PR_NUMBER" "$PR_TITLE" "$PR_URL")"
              ;;
            failure)
              text="$(printf '#pr #ci #failed\n🔴 PR #%s — CI упал\nЛоги: %s\nDiff: %s/files' \
                "$PR_NUMBER" "$RUN_URL" "$PR_URL")"
              ;;
            cancelled|skipped)
              echo "CI result is $CI_RESULT; this is not a failure notification."
              exit 0
              ;;
            *)
              text="$(printf '#pr #ci #warning\n🟡 PR #%s — CI завершился со статусом %s\nЛоги: %s\n%s' \
                "$PR_NUMBER" "$CI_RESULT" "$RUN_URL" "$PR_URL")"
              ;;
          esac

          if ! notification_is_current; then
            exit 0
          fi

          curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            >/dev/null
