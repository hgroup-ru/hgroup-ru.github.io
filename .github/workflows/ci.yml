name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Validate release notes
        run: python3 scripts/validate_release_notes.py

      - name: Setup
        id: setup
        uses: ./.github/workflows/setup

      - name: Format misc batch
        run: |
          npx prettier --write \
            i18n/ru/docusaurus-plugin-content-docs/current/misc/convention-reasons.mdx \
            i18n/ru/docusaurus-plugin-content-docs/current/misc/efficiency.mdx \
            i18n/ru/docusaurus-plugin-content-docs/current/misc/empty-clues.mdx \
            i18n/ru/docusaurus-plugin-content-docs/current/misc/hat-guessing.mdx
          if ! git diff --quiet -- \
            i18n/ru/docusaurus-plugin-content-docs/current/misc/convention-reasons.mdx \
            i18n/ru/docusaurus-plugin-content-docs/current/misc/efficiency.mdx \
            i18n/ru/docusaurus-plugin-content-docs/current/misc/empty-clues.mdx \
            i18n/ru/docusaurus-plugin-content-docs/current/misc/hat-guessing.mdx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              i18n/ru/docusaurus-plugin-content-docs/current/misc/convention-reasons.mdx \
              i18n/ru/docusaurus-plugin-content-docs/current/misc/efficiency.mdx \
              i18n/ru/docusaurus-plugin-content-docs/current/misc/empty-clues.mdx \
              i18n/ru/docusaurus-plugin-content-docs/current/misc/hat-guessing.mdx
            git commit -m "style: отформатировать misc translations"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Lint
        run: npm run lint

      - name: Build RU site for fork pull requests
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: npm run build:ru

  notify:
    name: Telegram notification
    needs: validate
    if: ${{ always() && !startsWith(github.head_ref, 'automation/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          CI_RESULT: ${{ needs.validate.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram notifications are not configured; skipping."
            exit 0
          fi

          if [ "$CI_RESULT" = "success" ]; then
            text="$(printf '#pr #ci #ready\n🟢 PR #%s готов к merge\n%s\nCI: validate ✓\n%s' \
              "$PR_NUMBER" "$PR_TITLE" "$PR_URL")"
          else
            text="$(printf '#pr #ci #failed\n🔴 PR #%s: CI упал\n%s\nРезультат: %s\n%s' \
              "$PR_NUMBER" "$PR_TITLE" "$CI_RESULT" "$RUN_URL")"
          fi

          curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            >/dev/null
