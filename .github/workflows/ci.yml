name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        id: setup
        uses: ./.github/workflows/setup

      - name: Lint
        run: npm run lint

      - name: Build RU site for audit QA
        id: audit_build
        if: ${{ always() && steps.setup.outcome == 'success' && github.event.pull_request.head.ref == 'audit/whole-site-consistency' }}
        run: npm run build:ru

      - name: Upload audit build artifact
        if: ${{ always() && steps.audit_build.outcome == 'success' && github.event.pull_request.head.ref == 'audit/whole-site-consistency' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

      - name: Upload audit source snapshot
        if: ${{ always() && steps.setup.outcome == 'success' && github.event.pull_request.head.ref == 'audit/whole-site-consistency' }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-source
          path: i18n/ru/docusaurus-plugin-content-docs/current
          retention-days: 1

      - name: Build RU site for fork pull requests
        if: ${{ always() && steps.setup.outcome == 'success' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: npm run build:ru
