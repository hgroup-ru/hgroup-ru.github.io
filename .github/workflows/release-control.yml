name: Publication Control

on:
  issues:
    types:
      - closed

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: github.event.issue.number == 100 || github.event.issue.number == 102
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publication workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_ISSUE: ${{ github.event.issue.number }}
        run: |
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          if [ "$default_branch" != "main" ]; then
            echo "Expected default branch main, got $default_branch."
            exit 1
          fi

          case "$CONTROL_ISSUE" in
            100) workflow="release.yml"; label="Official Release" ;;
            102) workflow="publish.yml"; label="Publish Site" ;;
            *)
              echo "Unsupported control issue: $CONTROL_ISSUE"
              exit 1
              ;;
          esac

          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "Dispatching $label from main at $source_sha."
          jq -n --arg ref main '{ref: $ref}' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              --input -

          gh issue comment "$CONTROL_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "${label} requested from \`main\` at \`$source_sha\`."

      - name: Reopen control issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_ISSUE: ${{ github.event.issue.number }}
        run: gh issue reopen "$CONTROL_ISSUE" --repo "$GITHUB_REPOSITORY"
