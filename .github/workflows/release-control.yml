name: Release Control

on:
  issues:
    types:
      - closed

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: github.event.issue.number == 100 || github.event.issue.number == 102
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Production workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_ISSUE: ${{ github.event.issue.number }}
        run: |
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          if [ "$default_branch" != "main" ]; then
            echo "Expected default branch main, got $default_branch."
            exit 1
          fi

          case "$CONTROL_ISSUE" in
            100) mode="release" ;;
            102) mode="fix" ;;
            *)
              echo "Unsupported control issue: $CONTROL_ISSUE"
              exit 1
              ;;
          esac

          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "Dispatching Release mode=$mode from main at $source_sha."

          jq -n --arg ref main --arg mode "$mode" \
            '{ref: $ref, inputs: {mode: $mode}}' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
              --input -

          gh issue comment "$CONTROL_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Production workflow requested in \`$mode\` mode from \`main\` at \`$source_sha\`."

      - name: Reopen control issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_ISSUE: ${{ github.event.issue.number }}
        run: gh issue reopen "$CONTROL_ISSUE" --repo "$GITHUB_REPOSITORY"
